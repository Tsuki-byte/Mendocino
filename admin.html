<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Motor Mendocino</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --admin-primary: #1e40af;
            --admin-secondary: #0f172a;
            --admin-accent: #3b82f6;
            --admin-bg: #f1f5f9;
        }

        body {
            background-color: var(--admin-bg);
            font-family: 'Inter', -apple-system, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        .admin-sidebar {
            background: var(--admin-secondary);
            color: white;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar-brand {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: rgba(255,255,255,0.7);
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-item.active {
            background: var(--admin-accent);
            color: white;
        }

        .admin-main {
            padding: 40px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 { margin: 0; font-size: 28px; }
        .page-title p { margin: 5px 0 0; color: #64748b; }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .stat-value { font-size: 24px; font-weight: 700; color: var(--admin-primary); }
        .stat-label { font-size: 14px; color: #64748b; }

        .data-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-toolbar {
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Tabla Estilizada */
        .admin-tabla {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-tabla th {
            text-align: left;
            padding: 15px 20px;
            background: #f8fafc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748b;
        }

        .admin-tabla td {
            padding: 15px 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .admin-tabla tr:hover { background: #f8fafc; }

        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; background: #e2e8f0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #475569; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-admin { background: #fee2e2; color: #b91c1c; }
        .badge-user { background: #dcfce7; color: #15803d; }

        .actions-cell { display: flex; gap: 10px; }
        
        .btn-icon {
            border: none;
            background: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            color: #64748b;
        }

        .btn-icon:hover { background: #f1f5f9; color: var(--admin-primary); }
        .btn-icon.btn-danger-icon:hover { background: #fee2e2; color: #ef4444; }

        @media (max-width: 992px) {
            .admin-layout { grid-template-columns: 1fr; }
            .admin-sidebar { display: none; }
        }
    </style>
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-brand">⚙️ Mendocino</div>
            <nav>
                <a href="index.html" class="nav-item">🏠 Volver a la App</a>
                <a href="#" class="nav-item active">👥 Alumnos</a>
                <a href="#" class="nav-item" onclick="mostrarToast('Fase de informes en desarrollo', 'info')">📊 Informes</a>
            </nav>
            <div style="margin-top:auto;">
                <button class="nav-item" onclick="salirModoAdminDesdePanel()" style="background:none; border:none; width:100%; text-align:left;">🚪 Salir sesión</button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="page-header">
                <div class="page-title">
                    <h1>Gestionar Alumnos</h1>
                    <p>Panel central para ver niveles y accesos de los usuarios.</p>
                </div>
                <div id="badge-admin-actual" class="admin-badge">Admin</div>
            </header>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-value" id="count-total">0</div>
                    <div class="stat-label">Total Alumnos</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="count-admins">0</div>
                    <div class="stat-label">Administradores</div>
                </div>
            </div>

            <div class="data-card">
                <div class="table-toolbar">
                    <input type="text" id="search-users" placeholder="Buscar por nombre o email..." onkeyup="filtrarUsuarios()" style="padding: 10px 15px; border: 1px solid #e2e8f0; border-radius: 8px; width: 300px;">
                    <span id="contador-usuarios" style="font-weight: 600; color: #64748b;">Cargando...</span>
                </div>
                <div id="contenedor-lista-usuarios"></div>
            </div>
        </main>
    </div>

    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>

    <script>
        let fullUsuarios = [];

        async function asegurarAdminPanel() {
            const { data: { user } } = await dbMendocinoClient.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return false;
            }
            
            const { data: profile } = await dbMendocinoClient.from('profiles').select('rol').eq('id', user.id).single();
            if (!profile || profile.rol !== 'admin') {
                alert('Acceso denegado. Se requiere cuenta de administrador.');
                window.location.href = 'index.html';
                return false;
            }
            return true;
        }

        async function cargarUsuarios() {
            const contenedor = document.getElementById('contenedor-lista-usuarios');
            contenedor.innerHTML = '<div style="padding:40px; text-align:center;">Cargando base de datos...</div>';
            
            const { data, error } = await dbMendocinoClient.from('profiles').select('*').order('nombre', { ascending: true });
            
            if (error) {
                mostrarToast('Error cargando alumnos: ' + error.message, 'error');
                return;
            }

            fullUsuarios = data || [];
            actualizarEstadisticas();
            renderizarTabla(fullUsuarios);
        }

        function actualizarEstadisticas() {
            document.getElementById('count-total').textContent = fullUsuarios.length;
            document.getElementById('count-admins').textContent = fullUsuarios.filter(u => u.rol === 'admin').length;
            document.getElementById('contador-usuarios').textContent = `${fullUsuarios.length} alumnos`;
        }

        function renderizarTabla(lista) {
            const contenedor = document.getElementById('contenedor-lista-usuarios');
            
            if (lista.length === 0) {
                contenedor.innerHTML = '<div style="padding:40px; text-align:center; color:#64748b;">No se encontraron resultados.</div>';
                return;
            }

            contenedor.innerHTML = `
                <table class="admin-tabla">
                    <thead>
                        <tr>
                            <th>Alumno</th>
                            <th>Rol</th>
                            <th>Nivel / Permisos</th>
                            <th style="text-align:right;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${lista.map(u => `
                            <tr>
                                <td>
                                    <div class="user-info">
                                        <div class="user-avatar">${(u.nombre || 'U')[0].toUpperCase()}</div>
                                        <div>
                                            <div style="font-weight:700;">${u.nombre || 'Sin nombre'}</div>
                                            <div style="font-size:12px; color:#64748b;">${u.email}</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge ${u.rol === 'admin' ? 'badge-admin' : 'badge-user'}">
                                        ${u.rol === 'admin' ? 'Admin' : 'Alumno'}
                                    </span>
                                </td>
                                <td>
                                    <select onchange="guardarNivelDesdePanel('${u.id}', this.value)" style="padding:5px; border-radius:5px; border:1px solid #cbd5e1; width: 120px;">
                                        <option value="basico" ${u.nivel === 'basico' ? 'selected' : ''}>Básico</option>
                                        <option value="avanzado" ${u.nivel === 'avanzado' ? 'selected' : ''}>Avanzado</option>
                                        <option value="experto" ${u.nivel === 'experto' ? 'selected' : ''}>Experto</option>
                                    </select>
                                </td>
                                <td style="text-align:right;">
                                    <div class="actions-cell" style="justify-content: flex-end;">
                                        <button class="btn-icon btn-danger-icon" title="Eliminar Alumno" onclick="eliminarUsuarioDesdePanel('${u.id}', '${escaparTexto(u.nombre)}')">
                                            🗑️
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function filtrarUsuarios() {
            const query = document.getElementById('search-users').value.toLowerCase();
            const filtrados = fullUsuarios.filter(u => 
                (u.nombre || '').toLowerCase().includes(query) || 
                (u.email || '').toLowerCase().includes(query)
            );
            renderizarTabla(filtrados);
        }

        async function guardarNivelDesdePanel(id, nuevoNivel) {
            const { error } = await dbMendocinoClient.from('profiles').update({ nivel: nuevoNivel }).eq('id', id);

            if (error) {
                alert('No se pudo guardar: ' + error.message);
                cargarUsuarios(); // Revertir
                return;
            }
            mostrarToast('Nivel actualizado correctamente', 'ok');
        }

        async function eliminarUsuarioDesdePanel(id, nombre) {
            // Un admin no puede borrarse a sí mismo desde el panel para evitar bloqueos
            const { data: { user } } = await dbMendocinoClient.auth.getUser();
            if (user.id === id) {
                alert('No puedes eliminarte a ti mismo desde este panel.');
                return;
            }

            if (!confirm(`¿Estás seguro de que quieres dar de baja a ${nombre}? El alumno ya no tendrá acceso a la calculadora.`)) {
                return;
            }

            const { error } = await dbMendocinoClient.from('profiles').delete().eq('id', id);

            if (error) {
                mostrarToast('Error al eliminar: ' + error.message, 'error');
                return;
            }

            mostrarToast('Usuario eliminado del sistema local.', 'ok');
            cargarUsuarios();
        }

        function escaparTexto(texto) {
            return String(texto).replace(/'/g, "\\'");
        }

        async function salirModoAdminDesdePanel() {
            if (confirm('¿Cerrar sesión de administrador?')) {
                await dbMendocinoClient.auth.signOut();
                window.location.href = 'index.html';
            }
        }

        window.addEventListener('load', async () => {
            const esAdminOK = await asegurarAdminPanel();
            if (esAdminOK) {
                cargarUsuarios();
            }
        });
    </script>
    <div id="contenedor-toast" class="contenedor-toast"></div>
</body>
</html>
